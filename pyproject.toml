[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawer-interaction"
version = "0.1.0"
description = "Standalone OpenUSD drawer scene authoring and interaction schedule template"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
usd = ["usd-core>=25.5,<26"]

[project.scripts]
drawer-interaction = "drawer_interaction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
